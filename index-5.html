<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klarsicht Optik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --sunken:#E3E9E8; --ink:#16202A; --muted:#58646F;
  --line:#D3DBDA; --accent:#0F6E5C; --accent-hover:#0B5A4B; --accent-ink:#FFFFFF;
  --danger:#B3261E; --overlay:rgba(14,22,28,.55);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --r-sm:6px; --r-md:12px; --r-lg:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11191E; --surface:#19232A; --sunken:#0D1418; --ink:#E6ECEB; --muted:#9AA7AD;
    --line:#2B3940; --accent:#3FB59A; --accent-hover:#5CC9AE; --accent-ink:#05231C;
    --danger:#F08A82; --overlay:rgba(0,0,0,.65);
    color-scheme:dark;
  }
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.08;margin:0;letter-spacing:-.015em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-small{padding:8px 14px;font-size:14px}
.icon-btn{background:none;border:0;cursor:pointer;padding:8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.icon-btn:hover{background:var(--sunken)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:14px}

/* Topbar */
.topbar{background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:500}
.topbar-in{max-width:1400px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:36px;flex-wrap:wrap}
.topbar button.cta{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-left:6px}
.util{display:flex;align-items:center;gap:16px}
.util a{color:inherit;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.util a:hover,.util a[aria-current="page"]{text-decoration:underline;text-underline-offset:3px}
.lang{display:inline-flex;border:1.5px solid currentColor;border-radius:999px;padding:2px}
.lang button{background:none;border:0;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;cursor:pointer;color:inherit}
.lang button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;display:flex;align-items:center;gap:10px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.logo svg{width:44px}
nav.main{display:flex;gap:2px;margin-left:8px}
nav.main a{padding:8px 10px;border-radius:999px;font-weight:600;font-size:15.5px;color:var(--ink);text-decoration:none;white-space:nowrap;position:relative}
nav.main a:hover,nav.main a.hot{background:var(--sunken)}
.flyout{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 24px 40px rgba(0,0,0,.12)}
.flyout[hidden]{display:none}
.fly-in{max-width:1400px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 300px;gap:32px;padding-top:28px;padding-bottom:32px}
.fly-col h3{font-size:15px;font-family:var(--body);font-weight:600;color:var(--muted);margin-bottom:10px}
.fly-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.fly-col button{background:none;border:0;padding:6px 0;font-size:16px;cursor:pointer;text-align:left;color:var(--ink)}
.fly-col button:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.fly-feature{border-radius:var(--r-md);overflow:hidden;background:var(--sunken);position:relative;min-height:180px;border:0;padding:0;cursor:pointer;text-align:left}
.fly-feature img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.fly-feature span{position:absolute;left:12px;bottom:12px;background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
nav.main a[aria-current="page"]{color:var(--accent)}
nav.main a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:1px;height:2px;border-radius:2px;background:var(--accent)}
.menu-btn{display:none}
.search{flex:1 1 240px;min-width:128px;max-width:300px;margin-left:auto;position:relative}
.bar .icon-btn,.logo,nav.main{flex-shrink:0}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;color:var(--muted)}
.cart-count{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;font-weight:600;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.account-name{font-weight:500;font-size:14px}

/* Hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-top:48px;padding-bottom:64px}
.hero h1{font-size:clamp(38px,4.6vw,64px);max-width:13ch}
.hero p.lead{font-size:19px;color:var(--muted);max-width:44ch;margin-top:20px}
.hero .ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .facts{display:flex;gap:28px;margin-top:40px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.hero .facts strong{display:block;color:var(--ink);font-size:16px}
.mirror-col{display:flex;flex-direction:column;align-items:center;gap:20px}
.mirror{width:min(420px,90%,58vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 32%,var(--surface) 0%,var(--sunken) 78%);border:1px solid var(--line);display:grid;place-items:center;box-shadow:inset 0 0 0 14px var(--paper),inset 0 0 0 15px var(--line)}
.mirror{overflow:hidden}
.mirror .frame{width:100%;height:100%;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.mirror .frame.swap{opacity:0;transform:translateY(10px) scale(.96)}
.shape-picker{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.shape-picker button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;font-weight:500}
.shape-picker button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.shape-link{font-size:14px;font-weight:600;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Collection */
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.section-head h2{font-size:clamp(30px,4vw,44px)}
.result-count{color:var(--muted);font-size:14px}
.shop{display:grid;grid-template-columns:240px 1fr;gap:36px;padding-bottom:80px}
.filters{position:sticky;top:92px;align-self:start;display:flex;flex-direction:column;gap:26px}
.filters fieldset{border:0;padding:0;margin:0}
.filters legend{font-weight:600;margin-bottom:10px;font-size:15px}
.seg,.checks{display:flex;flex-direction:column;gap:4px}
.seg label,.checks label{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer;padding:4px 0}
.seg input,.checks input{accent-color:var(--accent);width:17px;height:17px}
.range-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.filters select{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface)}
.reset{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
.card .shot{background:var(--sunken);aspect-ratio:4/3;display:grid;place-items:center;position:relative;cursor:pointer;border:0;padding:0;width:100%}
.card .shot svg{width:76%}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.pimg-fb{width:100%;height:100%;display:grid;place-items:center}.pimg-fb svg{width:76%}
.card .shot{overflow:hidden}
.card .shot .pimg{transition:transform .4s}
.card .shot:hover .pimg{transform:scale(1.04)}
.badge{position:absolute;z-index:1;top:12px;left:12px;background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.badge.sun{background:var(--ink);color:var(--paper)}
.card .body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:22px}
.card .price{font-weight:600}
.card .meta{color:var(--muted);font-size:14px}
.dots{display:flex;gap:7px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.card .actions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.card .actions .btn{flex:1}
.empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-md);padding:40px;text-align:center}
.empty p{color:var(--muted);margin:8px 0 16px}

.service{background:var(--ink);color:var(--paper);padding:56px 0}
.service .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.service h3{font-size:22px;margin-bottom:8px}
.service p{opacity:.8;font-size:15px}

footer{padding:56px 0 40px;border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px}
.foot h3{font-size:24px;margin-bottom:10px}
.foot p{color:var(--muted)}
.nl-form{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.nl-form input{flex:1;min-width:200px;padding:12px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface)}
.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.foot ul a{color:inherit;text-decoration:none}
.foot ul a:hover{color:var(--ink);text-decoration:underline}
.legal{margin-top:40px;font-size:13px;color:var(--muted)}

/* Anmeldung */
.overlay{position:fixed;inset:0;background:var(--paper);z-index:50;display:flex;padding:24px;overflow-y:auto}
.overlay[hidden]{display:none}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:min(460px,100%);margin:auto;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.panel .lang{position:absolute;top:20px;right:20px;color:var(--accent)}
.panel .lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel h2{font-size:30px;padding-right:90px}
.panel .sub{color:var(--muted);margin-top:8px}
.tabs{display:flex;background:var(--sunken);border-radius:999px;padding:4px;margin:24px 0 20px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line),0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field input,.field select{width:100%;min-width:0;padding:12px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--paper)}
.field input[aria-invalid="true"]{border-color:var(--danger)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 14px;cursor:pointer}
.check input{accent-color:var(--accent);width:18px;height:18px;margin-top:1px;flex-shrink:0}
.panel .btn-primary{width:100%;margin-top:6px}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.interest{display:flex;flex-direction:column;gap:4px;background:var(--paper);border-radius:var(--r-md);padding:14px 16px;margin:20px 0}
.stack{display:flex;flex-direction:column;gap:10px}

/* Dialoge */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:var(--r-lg);width:min(980px,calc(100% - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:var(--overlay)}
.dlg-close{position:absolute;top:14px;right:14px;z-index:3;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.pd{display:grid;grid-template-columns:1fr 1fr;min-height:520px}
.pd .stage{background:var(--sunken);display:grid;place-items:center;padding:0;overflow:hidden;border-radius:var(--r-lg) 0 0 var(--r-lg)}
.pd .stage .pimg{min-height:520px}
.pd .info{padding:36px 32px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;max-height:calc(100vh - 32px)}
.pd h2{font-size:40px}
.pd .meta{color:var(--muted)}
.opt-title{font-weight:600;font-size:15px;margin-bottom:8px}
.opt-title span{font-weight:400;color:var(--muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;font-size:14px;text-align:left}
.pill small{display:block;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:16px;font-size:15px}
.total strong{font-family:var(--display);font-size:30px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.pd .btns .btn{flex:1}

/* Anprobe */
.to{display:grid;grid-template-columns:1.6fr 1fr}
.to-stage{position:relative;background:#0c1216;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r-lg) 0 0 var(--r-lg);touch-action:none;user-select:none}
.to-stage video,.to-stage img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.to-stage video{transform:scaleX(-1)}
.to-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#E6ECEB;text-align:center;padding:24px}
.to-placeholder p{max-width:36ch;opacity:.8}
.to-placeholder .face{width:120px;height:150px;border:2px dashed rgba(255,255,255,.4);border-radius:50% 50% 46% 46%}
.to-glasses{position:absolute;cursor:grab;transform-origin:center;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.to-glasses:active{cursor:grabbing}
.to-glasses svg{width:100%;display:block;pointer-events:none}
.to-status{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:6px 12px;border-radius:999px}
.to-side{padding:28px 24px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;max-height:calc(100vh - 32px)}
.to-side h2{font-size:28px;padding-right:40px}
.to-src{display:flex;gap:8px;flex-wrap:wrap}
.slider label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip button{background:var(--sunken);border:1.5px solid transparent;border-radius:var(--r-sm);padding:8px 6px 4px;cursor:pointer;font-size:12px}
.strip button svg{width:100%}
.strip button[aria-pressed="true"]{border-color:var(--accent)}
.to-msg{font-size:14px;background:var(--paper);border-radius:var(--r-sm);padding:10px 12px;color:var(--muted)}
.to-msg.error{color:var(--danger)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:18px;height:18px}

/* Warenkorb */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}
.drawer.open{transform:none;visibility:visible;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:26px}
.drawer-body{flex:1;overflow-y:auto;padding:12px 24px}
.ci{display:grid;grid-template-columns:84px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.ci .thumb{background:var(--sunken);border-radius:var(--r-sm);padding:10px 6px;overflow:hidden}
.ci .thumb.photo{padding:0;aspect-ratio:4/3}
.ci .thumb svg{width:100%;display:block}
.ci h3{font-size:18px}
.ci p{font-size:13px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;margin-top:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer}
.ci .rm{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;margin-top:6px;padding:0}
.drawer-foot{padding:20px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.drawer-foot:empty{display:none}
.drawer-foot .line{display:flex;justify-content:space-between;font-size:15px}
.drawer-foot .sum{font-weight:600;font-size:18px}
.drawer-empty{text-align:center;padding:48px 8px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:55}
.scrim[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(calc(100% + 40px));opacity:0;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;z-index:80;font-weight:500;transition:transform .3s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* Unterseiten */
.view[hidden]{display:none}
.page{padding-top:48px;padding-bottom:88px}
.page-head{max-width:62ch;margin-bottom:36px}
.page-head h1{font-size:clamp(36px,4.4vw,56px)}
.page-head p{color:var(--muted);font-size:18px;margin-top:14px}
.page h2{font-size:30px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:24px;display:flex;flex-direction:column;gap:10px}
.tile h3{font-size:23px}
.tile p{color:var(--muted);font-size:15px}
.tile .meta{font-size:14px;color:var(--muted)}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.tile .price{font-weight:600;font-size:18px}
.tile .icon{width:56px;height:56px;color:var(--accent)}
.brand-mark{font-family:var(--display);font-size:32px;line-height:1.1;padding:20px 0 18px;border-bottom:1px solid var(--line);margin-bottom:4px}
.band{margin-top:40px;background:var(--sunken);border-radius:var(--r-lg);padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.band h3{font-size:24px}
.band p{color:var(--muted);margin-top:4px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.advisor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px}
.advisor .result{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.advisor .result p{color:var(--muted);margin:6px 0 16px}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq details:first-of-type{border-top:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:600;font-size:17px}
.faq details p{color:var(--muted);margin-top:10px;max-width:60ch}
.booking-wrap{display:grid;grid-template-columns:minmax(0,720px) 1fr;gap:40px;align-items:start}
.booking{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;display:flex;flex-direction:column;gap:22px}
.booking .field{margin:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.slots .pill{text-align:center}
.slots .pill[disabled]{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.confirm{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r-lg);padding:28px}
.confirm h2{font-size:28px;margin-bottom:10px}
.confirm p{color:var(--muted);margin-bottom:18px}
.my-appts h3{font-size:20px;margin-bottom:10px}
.my-appts ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.my-appts li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;font-size:15px}
.my-appts li span{display:block;color:var(--muted);font-size:14px}

/* Filialfinder */
.finder{display:grid;grid-template-columns:390px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;height:min(680px,calc(100vh - 200px));min-height:540px}
.finder-side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.finder-search{padding:20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.finder-search form{display:flex;gap:8px}
.finder-search input[type=search]{flex:1;min-width:0;padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper)}
.finder-tools{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;font-size:14px}
.finder-tools label{display:flex;align-items:center;gap:8px;cursor:pointer}
.finder-tools input{accent-color:var(--accent);width:17px;height:17px}
.finder-body{overflow-y:auto;flex:1;min-height:0}
.finder-head{padding:12px 20px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.finder-head.error{color:var(--danger)}
.store-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 20px;cursor:pointer}
.store-item:hover{background:var(--sunken)}
.store-item h3{font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.store-item h3 span{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.store-item p{font-size:14px;color:var(--muted)}
.status{font-size:13px;font-weight:600;margin-top:4px;display:block}
.status.open{color:var(--accent)}
.status.closed{color:var(--muted)}
.store-detail{padding:20px;display:flex;flex-direction:column;gap:18px}
.store-detail h2{font-size:28px;margin:0}
.store-detail dl{margin:0;display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px 18px;font-size:15px}
.store-detail dt{color:var(--muted)}
.store-detail dd{margin:0;overflow-wrap:anywhere}
.store-detail dd small{display:block;color:var(--muted);font-size:14px}
.hours{width:100%;border-collapse:collapse;font-size:15px}
.hours td{padding:7px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--sunken);border-radius:999px;padding:4px 12px;font-size:13px}
.store-detail .btns .btn{flex:1}
.finder-map{position:relative;min-height:0;isolation:isolate;z-index:0}
#mapBox{position:absolute;inset:0;background:var(--sunken)}
.map-err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.leaflet-container{font:inherit}
.pin{background:none;border:0}
.pin span{display:block;width:24px;height:24px;margin:2px;border-radius:50% 50% 50% 0;background:var(--accent);border:3px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.pin.active span{background:#16202A;transform:rotate(-45deg) scale(1.3)}
.you span{display:block;width:18px;height:18px;border-radius:50%;background:#2E6FB0;border:3px solid #fff;box-shadow:0 0 0 7px rgba(46,111,176,.25)}

@media (max-width:1280px){
  .menu-btn{display:inline-flex}
  .flyout{display:none!important}
  nav.main{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px 18px;margin:0;box-shadow:0 20px 40px rgba(0,0,0,.12)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 10px;font-size:17px;border-radius:var(--r-sm)}
  nav.main a[aria-current="page"]{background:var(--sunken)}
  nav.main a[aria-current="page"]::after{display:none}
  .search{max-width:none}
}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:40px;padding-bottom:56px;gap:36px}
  .shop{grid-template-columns:1fr}
  .filters{position:static;flex-direction:row;overflow-x:auto;gap:24px;padding-bottom:8px}
  .filters fieldset{min-width:170px}
  .pd,.to,.split,.booking-wrap{grid-template-columns:1fr}
  .to-stage{border-radius:var(--r-lg) var(--r-lg) 0 0}
  .pd .info,.to-side{max-height:none}
  .service .wrap,.foot{grid-template-columns:1fr}
  .finder{grid-template-columns:1fr;height:auto}
  .finder-map{height:340px;order:-1}
  .finder-side{border-right:0}
  .finder-body{max-height:520px}
  .topbar-in{justify-content:center;padding-top:6px;padding-bottom:6px}
}
@media (max-width:560px){
  .search,.account-name{display:none}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

const users=[]; let currentUser=null;
function setTab(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('#registerForm').hidden=tab!=='register'; $('#loginForm').hidden=tab!=='login';
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#registerForm').onsubmit=e=>{
  e.preventDefault();
  const f={first:$('#rFirst').value.trim(),last:$('#rLast').value.trim(),mail:$('#rMail').value.trim().toLowerCase(),pass:$('#rPass').value};
  const err=$('#regErr'); ['#rFirst','#rLast','#rMail','#rPass'].forEach(s=>$(s).removeAttribute('aria-invalid'));
  const bad=(k,sel)=>{err.textContent=t(k);if(sel)$(sel).setAttribute('aria-invalid','true')};
  if(!f.first||!f.last) return bad('errName',!f.first?'#rFirst':'#rLast');
  if(!mailOk(f.mail)) return bad('errMail','#rMail');
  if(f.pass.length<8) return bad('errPass','#rPass');
  if(!$('#rTerms').checked) return bad('errTerms');
  if(users.some(u=>u.mail===f.mail)) return bad('errExists');
  err.textContent=''; currentUser={...f,newsletter:false,interests:[]}; users.push(currentUser);
  $('#authStep').hidden=true; $('#newsletterStep').hidden=false; $('#nlYes').focus();
};
$('#loginForm').onsubmit=e=>{
  e.preventDefault();
  const u=users.find(u=>u.mail===$('#lMail').value.trim().toLowerCase()&&u.pass===$('#lPass').value);
  if(!u){$('#logErr').textContent=t('errLogin');return}
  currentUser=u; enterShop(t('welcomeBack',{n:u.first}));
};
$('#nlYes').onclick=()=>{
  currentUser.newsletter=true;
  currentUser.interests=[...document.querySelectorAll('#newsletterStep input:checked')].map(i=>i.value);
  enterShop(t('nlConfirm',{m:currentUser.mail}));
};
$('#nlNo').onclick=()=>enterShop(t('welcome',{n:currentUser.first}));
function enterShop(msg){
  $('#authOverlay').hidden=true; document.body.classList.remove('locked');
  $('#accountName').textContent=currentUser.first; updateFootNewsletter(); renderBooking(); toast(msg);
}
function showAuth(){
  $('#authStep').hidden=false; $('#newsletterStep').hidden=true;
  document.querySelectorAll('#authPanel form').forEach(f=>f.reset());
  document.querySelectorAll('.err').forEach(e=>e.textContent='');
  $('#authOverlay').hidden=false; document.body.classList.add('locked'); setTab('login');
}
$('#accountBtn').onclick=()=>{
  if(!currentUser){showAuth();return}
  if(confirm(t('logoutQ',{n:currentUser.first+' '+currentUser.last,m:currentUser.mail}))){
    currentUser=null; $('#accountName').textContent=''; cart.length=0; renderCart(); updateFootNewsletter();
    if(REQUIRE_LOGIN) showAuth();
  }
};
function updateFootNewsletter(){
  const subbed=currentUser&&currentUser.newsletter;
  $('#nlFoot').hidden=subbed;
  $('#nlFootText').textContent=subbed?t('nlFootSubbed',{m:currentUser.mail}):t('nlFootP');
  if(currentUser&&!subbed&&!$('#nlMail').value) $('#nlMail').value=currentUser.mail;
}
$('#nlFoot').onsubmit=e=>{
  e.preventDefault(); const m=$('#nlMail').value.trim();
  if(!mailOk(m)){toast(t('errMailB'));return}
  if(currentUser) currentUser.newsletter=true;
  updateFootNewsletter(); toast(t('nlConfirm',{m}));
};

function renderGrid(){
  const f=filters, q=f.q;
  const match=p=>!q||[p.name,brandName(p.brand),...SHAPES[p.shape],...MATS[p.material]].some(x=>x.toLowerCase().includes(q));
  let list=PRODUCTS.filter(p=>(f.type==='Alle'||p.type===f.type)&&(f.cat==='Alle'||p.cat===f.cat)&&(!f.brand||p.brand===f.brand)
    &&(!f.shapes.size||f.shapes.has(p.shape))&&(!f.materials.size||f.materials.has(p.material))&&p.price<=f.max&&match(p));
  list.sort({pop:(a,b)=>a.pop-b.pop,asc:(a,b)=>a.price-b.price,desc:(a,b)=>b.price-a.price,name:(a,b)=>a.name.localeCompare(b.name)}[f.sort]);

const cart=[];
function addFrame(c){
  const key=['f',c.id,c.ci,c.size,c.lens,[...c.extras].sort().join('+')].join('|'), ex=cart.find(i=>i.key===key);
  if(ex) ex.qty++; else cart.push({key,kind:'frame',id:c.id,ci:c.ci,size:c.size,lens:c.lens,extras:[...c.extras],price:priceOf(c),qty:1});
  renderCart(); toast(t('inCart',{n:byId(c.id).name}));
}
function addSimple(ref,power){
  const key=['s',ref,power||''].join('|'), ex=cart.find(i=>i.key===key);
  if(ex) ex.qty++; else cart.push({key,kind:'simple',ref,power,qty:1});
  renderCart(); toast(t('inCart',{n:tr(simpleItem(ref).name)}));
}
const simpleItem=ref=>CL.find(x=>x.id===ref)||HEAR.find(x=>x.id===ref);
const itemPrice=i=>i.kind==='frame'?i.price:simpleItem(i.ref).price;
function simpleIcon(ref){
  return ref.startsWith('cl')
    ?'<svg viewBox="0 0 80 40" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"><path d="M12 30 Q40 0 68 30"/><ellipse cx="40" cy="30" rx="28" ry="5"/></svg>'
    :'<svg viewBox="0 0 80 40" fill="none" stroke="var(--accent)" stroke-width="3"><circle cx="40" cy="20" r="14"/><path d="M34 20h12M40 14v12" stroke-linecap="round"/></svg>';
}

function setMsg(k,isErr){to.msgKey=k;to.msgErr=!!isErr;const m=$('#toMsg');m.textContent=t(k);m.classList.toggle('error',!!isErr)}
function showSource(mode){to.mode=mode;video.hidden=mode!=='camera';photo.hidden=mode!=='photo';$('#toPlaceholder').hidden=mode!=='none';gl.hidden=mode==='none'}
async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMsg('mNoSupport',true);return}
  try{
    stopCamera();
    to.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});

    startTracking();
  }catch(err){
    setMsg({NotAllowedError:'mBlocked',NotFoundError:'mNotFound',NotReadableError:'mBusy'}[err.name]||'mGeneric',true);
  }
}
function stopCamera(){if(to.stream){to.stream.getTracks().forEach(x=>x.stop());to.stream=null}cancelAnimationFrame(rafId);$('#toCam').textContent=t('camStart');$('#toStatus').hidden=true}
$('#toCam').onclick=()=>{if(to.stream){stopCamera();showSource('none');setMsg('mStopped')}else startCamera()};

let drag=null;
gl.addEventListener('pointerdown',e=>{drag={sx:e.clientX,sy:e.clientY,x:to.x,y:to.y,r:stage.getBoundingClientRect()};gl.setPointerCapture(e.pointerId);$('#toAuto').checked=false;setMsg('mManual')});
gl.addEventListener('pointermove',e=>{if(!drag)return;to.x=Math.min(100,Math.max(0,drag.x+(e.clientX-drag.sx)/drag.r.width*100));to.y=Math.min(100,Math.max(0,drag.y+(e.clientY-drag.sy)/drag.r.height*100));placeGlasses()});
gl.addEventListener('pointerup',()=>drag=null);
gl.addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();to.x+=d[0];to.y+=d[1];$('#toAuto').checked=false;placeGlasses()}});
function mapPoint(px,py,sw,sh,mirror){
  const W=stage.clientWidth,H=stage.clientHeight,s=Math.max(W/sw,H/sh);
  let x=px*s+(W-sw*s)/2; const y=py*s+(H-sh*s)/2; if(mirror)x=W-x;
  return [x/W*100,y/H*100,s/W*100];
}
/* Gesichtserkennung mit MediaPipe Face Landmarker (läuft komplett im Browser) */
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let landmarker=null, lmPromise=null, lmMode='VIDEO', rafId=null, lastVideoTime=-1;
function loadLandmarker(){
  if(!lmPromise) lmPromise=(async()=>{
    const v=await import(MP+'/vision_bundle.mjs');
    const files=await v.FilesetResolver.forVisionTasks(MP+'/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'VIDEO',numFaces:1});
    try{landmarker=await v.FaceLandmarker.createFromOptions(files,opts('GPU'))}
    catch(e){landmarker=await v.FaceLandmarker.createFromOptions(files,opts('CPU'))}
    lmMode='VIDEO'; return landmarker;
  })().catch(e=>{console.warn(e);lmPromise=null;return null});
  return lmPromise;
}
async function setLmMode(m){if(landmarker&&lmMode!==m){await landmarker.setOptions({runningMode:m});lmMode=m}}
function applyFace(lm,sw,sh,mirror){
  if(!lm){$('#toStatus').hidden=false;$('#toStatus').textContent=t('noFace');return}
  $('#toStatus').hidden=true;
  const P=i=>[lm[i].x*sw,lm[i].y*sh];
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const eyeR=mid(P(33),P(133)), eyeL=mid(P(362),P(263));          // Augenmitten
  const [ax,ay,k]=mapPoint(eyeR[0],eyeR[1],sw,sh,mirror), [bx,by]=mapPoint(eyeL[0],eyeL[1],sw,sh,mirror);
  const d=Math.hypot(eyeL[0]-eyeR[0],eyeL[1]-eyeR[1]);
  const tx=(ax+bx)/2, ty=(ay+by)/2, tw=d*k/0.45*1.02;                 // Glasmitten liegen bei 45 % der SVG-Breite
  const Lp=ax<bx?[ax,ay,bx,by]:[bx,by,ax,ay];
  const trot=Math.atan2((Lp[3]-Lp[1])*stage.clientHeight,(Lp[2]-Lp[0])*stage.clientWidth)*180/Math.PI;
  const s=0.55; to.x+=(tx-to.x)*s; to.y+=(ty-to.y)*s; to.w+=(tw-to.w)*s; to.rot+=(trot-to.rot)*s; placeGlasses();
}
async function startTracking(){
  cancelAnimationFrame(rafId);
  if(!$('#toAuto').checked){setMsg('mManual');return}
  setMsg('mLoadingFace');
  const lmk=await loadLandmarker();
  if(!lmk){setMsg('mNoTrack');return}
  if(to.mode!=='camera') return;
  await setLmMode('VIDEO'); setMsg('mFollow');
  const loop=()=>{
    if(to.mode!=='camera'||!to.stream) return;
    if($('#toAuto').checked&&video.videoWidth&&video.currentTime!==lastVideoTime&&!drag){
      lastVideoTime=video.currentTime;
      try{const r=landmarker.detectForVideo(video,performance.now());applyFace(r.faceLandmarks[0],video.videoWidth,video.videoHeight,true)}catch(e){}
    }
    rafId=requestAnimationFrame(loop);
  };
  loop();
}
async function detectPhoto(){
  if(!$('#toAuto').checked) return;
  setMsg('mLoadingFace');
  const lmk=await loadLandmarker(); if(!lmk){setMsg('mNoTrack');return}
  await setLmMode('IMAGE');
  try{const r=landmarker.detect(photo);applyFace(r.faceLandmarks[0],photo.naturalWidth,photo.naturalHeight,false);setMsg(r.faceLandmarks[0]?'mPhotoDone':'mPhoto')}catch(e){setMsg('mPhoto')}
}
$('#toAuto').onchange=e=>{if(!e.target.checked)return;if(to.mode==='photo')detectPhoto();else if(to.mode==='camera')startTracking()};
$('#toSnap').onclick=()=>{
  if(to.mode==='none'){setMsg('mNeedSource',true);return}
  const W=stage.clientWidth*2,H=stage.clientHeight*2,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d'),cam=to.mode==='camera',src=cam?video:photo,sw=cam?video.videoWidth:photo.naturalWidth,sh=cam?video.videoHeight:photo.naturalHeight,s=Math.max(W/sw,H/sh);
  ctx.save(); if(cam){ctx.translate(W,0);ctx.scale(-1,1)} ctx.drawImage(src,(W-sw*s)/2,(H-sh*s)/2,sw*s,sh*s); ctx.restore();
  const p=byId(to.id),gw=to.w/100*W,img=new Image();
  img.onload=()=>{
    ctx.save();ctx.translate(to.x/100*W,to.y/100*H);ctx.rotate(to.rot*Math.PI/180);ctx.drawImage(img,-gw/2,-gw*0.2,gw,gw*0.4);ctx.restore();
    const a=document.createElement('a');a.download=`klarsicht-${p.name.toLowerCase()}.png`;a.href=cv.toDataURL('image/png');a.click();toast(t('snapSaved'));
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(frameSVG(p,p.colors[to.ci][1],400));
};

const finder={q:'',origin:null,originLabel:'',hearOnly:false,selected:null,error:'',loading:false};
let map=null; const markers={}; let youMarker=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtKm=d=>d.toLocaleString(loc(),{maximumFractionDigits:d<10?1:0})+' km';
function textMatches(q){const n=norm(q);return STORES.filter(s=>[s.name,s.street,s.zip,s.city,s.alias||''].some(x=>norm(x).includes(n)))}
function storeList(){
  let list=STORES.filter(s=>!finder.hearOnly||s.hearing);
  if(finder.origin) return list.map(s=>({...s,dist:km(finder.origin,s)})).sort((a,b)=>a.dist-b.dist);
  if(finder.q){const ids=new Set(textMatches(finder.q).map(s=>s.id));list=list.filter(s=>ids.has(s.id))}
  return list.sort((a,b)=>a.name.localeCompare(b.name));
}
function hoursFor(s,day){const h=HOURS[s.hours];return day===0?null:day===6?h.sat:h.wk}
function openState(s){
  const now=new Date(),day=now.getDay(),hm=now.toTimeString().slice(0,5),h=hoursFor(s,day);
  if(h&&hm>=h[0]&&hm<h[1]) return {open:true,text:t('sOpen',{t:h[1]})};
  for(let i=0;i<7;i++){const d=(day+i)%7,hh=hoursFor(s,d);if(!hh)continue;if(i===0&&hm>=hh[0])continue;
    const label=i===0?t('today'):i===1?t('tomorrow'):new Date(now.getTime()+i*864e5).toLocaleDateString(loc(),{weekday:'long'});
    return {open:false,text:t('sClosedOpens',{d:label,t:hh[0]})}}
  return {open:false,text:t('sClosed')};
}
function renderStores(){
  const body=$('#finderBody');
  if(finder.selected){
    const s=storeById(finder.selected),st=openState(s),h=HOURS[s.hours],day=new Date().getDay();
    const services=[['Sehtest','Eye test'],['Kontaktlinsen','Contact lenses'],['Brillen-Service','Glasses service']].concat(s.hearing?[['Hörakustik','Hearing care']]:[]);
    body.innerHTML=`<div class="store-detail">
      <button class="linkbtn" id="storeBack"><svg width="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 5l-7 7 7 7"/></svg>${t('sBack')}</button>
      <div><h2>Klarsicht ${s.name}</h2><span class="status ${st.open?'open':'closed'}">${st.text}</span></div>
      <dl>
        <dt>${t('sAddress')}</dt><dd>${s.street}<br>${s.zip} ${s.city}</dd>
        <dt>${t('sPhone')}</dt><dd><a href="tel:${s.phone.replace(/\s/g,'')}">${s.phone}</a></dd>
        <dt>${t('email')}</dt><dd><a href="mailto:${s.email}">${s.email}</a></dd>
        <dt>${t('sContact')}</dt><dd>${s.contact}<small>${tr(ROLES[s.role])}</small></dd>
      </dl>
      <div><p class="opt-title">${t('sHours')}</p><table class="hours">
        <tr class="${day>=1&&day<=5?'today':''}"><td>${t('hWeek')}</td><td>${h.wk[0]}–${h.wk[1]}</td></tr>
        <tr class="${day===6?'today':''}"><td>${t('hSat')}</td><td>${h.sat[0]}–${h.sat[1]}</td></tr>
        <tr class="${day===0?'today':''}"><td>${t('hSun')}</td><td>${t('hClosed')}</td></tr></table></div>
      <div><p class="opt-title">${t('sServices')}</p><div class="tags">${services.map(x=>`<span class="tag">${tr(x)}</span>`).join('')}</div></div>
      <div class="btns">
        <button class="btn btn-primary btn-small" id="storeBook">${t('sBookHere')}</button>
        <a class="btn btn-ghost btn-small" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.street+', '+s.zip+' '+s.city)}">${t('sRoute')}</a>
      </div></div>`;
    $('#storeBack').onclick=()=>{finder.selected=null;renderStores();fitMap()};
    $('#storeBook').onclick=()=>bookAt(s.id);
  }else{
    const list=storeList();
    let head=finder.loading?t('sSearching'):finder.error?finder.error:finder.origin?(finder.originLabel?t('sNear',{q:esc(finder.originLabel)}):t('sNearYou')):t(list.length===1?'sCount1':'sCountN',{n:list.length});
    if(!finder.loading&&!finder.error&&finder.q&&!finder.origin&&!list.length) head=t('sNone',{q:esc(finder.q)});
    body.innerHTML=`<p class="finder-head ${finder.error?'error':''}" role="status">${head}</p>`+list.map(s=>{const st=openState(s);
      return `<button class="store-item" data-store="${s.id}"><h3>${s.name}${s.dist!=null?`<span>${fmtKm(s.dist)}</span>`:''}</h3>
        <p>${s.street}, ${s.zip} ${s.city}</p><span class="status ${st.open?'open':'closed'}">${st.text}</span></button>`}).join('');
  }
  updateMarkers();
}

function selectStore(id){
  finder.selected=id; renderStores(); $('#finderBody').scrollTop=0;
  if(map){const s=storeById(id);map.flyTo([s.lat,s.lng],15,{duration:.6})}

$('#storeSearch').onsubmit=async e=>{
  e.preventDefault(); const q=$('#storeQ').value.trim(); finder.q=q; finder.selected=null; finder.error='';
  if(!q||textMatches(q).length){finder.origin=null;renderStores();fitMap();return}
  finder.loading=true; renderStores();
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de,at,ch&accept-language=${lang}&q=${encodeURIComponent(q)}`);
    const j=await r.json();
    if(j[0]){finder.origin={lat:+j[0].lat,lng:+j[0].lon};finder.originLabel=q}else{finder.origin=null}
  }catch(err){finder.origin=null}
  finder.loading=false; renderStores(); fitMap(4);
};

$('#locateBtn').onclick=()=>{
  if(!navigator.geolocation){finder.error=t('sLocErr');renderStores();return}
  finder.loading=true;finder.error='';finder.selected=null;renderStores();
  navigator.geolocation.getCurrentPosition(pos=>{
    finder.loading=false; finder.origin={lat:pos.coords.latitude,lng:pos.coords.longitude}; finder.originLabel=''; finder.q=''; $('#storeQ').value='';
    if(map&&window.L){if(youMarker)youMarker.remove();youMarker=L.marker([finder.origin.lat,finder.origin.lng],{icon:L.divIcon({className:'you',html:'<span></span>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(map).bindTooltip(t('sYou'))}
    renderStores(); fitMap(4);
  },()=>{finder.loading=false;finder.error=t('sLocErr');renderStores()},{timeout:10000});
};
function pinIcon(active){return L.divIcon({className:'pin'+(active?' active':''),html:'<span></span>',iconSize:[28,28],iconAnchor:[14,30]})}
function initMap(){
  if(map) return;
  if(!window.L){$('#mapBox').innerHTML=`<p class="map-err">${t('sMapErr')}</p>`;return}
  map=L.map('mapBox',{scrollWheelZoom:false}).setView([51.1,10.4],6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  STORES.forEach(s=>{
    const m=L.marker([s.lat,s.lng],{icon:pinIcon(false),title:'Klarsicht '+s.name,keyboard:true,riseOnHover:true}).addTo(map);
    m.bindTooltip(s.name,{direction:'top',offset:[0,-26]}); m.on('click',()=>selectStore(s.id)); markers[s.id]=m;
  });
  updateMarkers(); fitMap();
}
function updateMarkers(){
  if(!map) return;
  const visible=new Set(storeList().map(s=>s.id));
  STORES.forEach(s=>{const m=markers[s.id];m.setIcon(pinIcon(finder.selected===s.id));m.setOpacity(visible.has(s.id)||finder.selected===s.id?1:.35);m.setZIndexOffset(finder.selected===s.id?1000:0)});
}
function fitMap(limit){
  if(!map||finder.selected) return;
  let list=storeList(); if(limit) list=list.slice(0,limit);
  const pts=list.map(s=>[s.lat,s.lng]); if(finder.origin) pts.push([finder.origin.lat,finder.origin.lng]);
  if(pts.length) map.fitBounds(pts,{padding:[50,50],maxZoom:13});
}

const PAGES=['designer','kontaktlinsen','hoerakustik','beratung','termin','filialen'];
let pending=null;
let routeState=(()=>{try{return location.hash.replace(/^#\/?/,'')}catch(e){return ''}})();
const currentRoute=()=>routeState;

window.addEventListener('popstate',()=>{try{routeState=location.hash.replace(/^#\/?/,'')}catch(e){}route()});
function route(){
  const r=currentRoute(), view=PAGES.includes(r)?r:'home';
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='view-'+view);
  document.querySelectorAll('#mainNav a').forEach(a=>a.dataset.route===r?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));

  const f=FLY[key]; if(!f||matchMedia('(max-width:1280px)').matches) return;
  clearTimeout(flyTimer); flyKey=key;
  document.querySelectorAll('#mainNav a').forEach(a=>a.classList.toggle('hot',a.dataset.route===key));
  const p=byId(f.feature.p);
  $('#flyout').innerHTML=`<div class="wrap fly-in">${f.cols.map((c,ci)=>`<div class="fly-col">${tr(c.title)?`<h3>${tr(c.title)}</h3>`:'<h3>&nbsp;</h3>'}<ul>${c.items.map((x,ii)=>`<li><button data-fly="${ci}-${ii}">${tr(x.label)}</button></li>`).join('')}</ul></div>`).join('')}
    <button class="fly-feature" data-fly="feature"><img src="${photoUrl(p,600)}" alt="" loading="lazy"><span>${tr(f.feature.label)}</span></button></div>`;
  $('#flyout').hidden=false;
}
function closeFly(){flyKey=null;$('#flyout').hidden=true;document.querySelectorAll('#mainNav a.hot').forEach(a=>a.classList.remove('hot'))}
document.querySelectorAll('#mainNav a').forEach(a=>{
  a.addEventListener('mouseenter',()=>openFly(a.dataset.route));
  a.addEventListener('focus',()=>openFly(a.dataset.route));
});
$('header').addEventListener('mouseleave',()=>{flyTimer=setTimeout(closeFly,150)});
$('#flyout').addEventListener('mouseenter',()=>clearTimeout(flyTimer));
$('.search').addEventListener('mouseenter',closeFly);
$('#flyout').addEventListener('click',e=>{
  const b=e.target.closest('[data-fly]'); if(!b||!flyKey) return;
  const f=FLY[flyKey], v=b.dataset.fly; closeFly(); closeMenu();
  if(v==='feature') return f.feature.fn();
  const [ci,ii]=v.split('-').map(Number); f.cols[ci].items[ii].fn();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFly()});

$('#toCam').textContent=t('camStart'); setMsg('mDefault');
syncFilterUI(); renderGrid(); renderHero(false); renderCart(); renderBrands(); renderCL(); renderHear();
renderFace(); renderFaq(); renderBooking(); renderStores(); updateFootNewsletter(); route();
</script>
